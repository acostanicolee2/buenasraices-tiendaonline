<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Control · Buenas Raíces</title>
  
  <style>
    :root {
      --ink: #244031;
      --cream: #f8f2e4;
      --paper: #fffdf8;
      --leaf: #356c47;
      --lime: #dcecab;
      --line: #ded5c2;
      --muted: #6f776c;
      --shadow: 0 10px 25px rgba(36,64,49,0.08);
      --danger: #d9534f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
    
    /* Layout principal con Menú Lateral */
    .admin-layout { display: flex; height: 100vh; }

    /* Menú Lateral (Sidebar) */
    .sidebar { width: 260px; background: #1c3327; color: #fff; padding: 25px 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
    .sidebar-brand { font-family: Georgia, serif; font-size: 22px; font-weight: bold; border-bottom: 1px solid #ffffff22; padding-bottom: 15px; }
    .sidebar-brand i { font-style: normal; color: #8eb370; }
    
    .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: #d6e1d2; text-decoration: none; font-weight: 600; font-size: 14.5px; cursor: pointer; transition: 0.2s; }
    .nav-item:hover, .nav-item.active { background: var(--leaf); color: #fff; }
    .nav-item .icon { font-size: 18px; }
    .nav-item.disabled { opacity: 0.4; cursor: not-allowed; }

    /* Área de Contenido */
    .main-content { flex: 1; overflow-y: auto; padding: 35px 40px; background: var(--cream); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .header-bar h1 { font-family: Georgia, serif; margin: 0; font-size: 30px; font-weight: 400; }

    /* Vistas / Secciones */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Tarjetas y Formularios */
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px; }
    .card h2 { font-family: Georgia, serif; margin: 0 0 15px; font-weight: 400; font-size: 22px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; color: var(--ink); }
    input, select { font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px; background: #fff; color: var(--ink); outline: none; }
    input:focus, select:focus { border-color: var(--leaf); box-shadow: 0 0 0 3px #356c4718; }
    
    .btn { border: 0; border-radius: 10px; background: var(--leaf); color: #fff; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #285235; }
    .btn-secondary { background: #e0d8c3; color: var(--ink); }
    .btn-secondary:hover { background: #d0c5a9; }
    .btn-danger { background: var(--danger); color: #fff; padding: 5px 10px; font-size: 12px; }
    .btn-danger:hover { background: #bd362f; }
    .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }

    /* Tabla de Productos y Pedidos */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px 15px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { background: #f0e7d3; font-weight: 700; color: var(--ink); }
    
    .prod-img-preview { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #e5dbc4; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    /* Agrupación por Zonas */
    .zone-group { margin-bottom: 35px; }
    .zone-header { background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 18px; font-weight: bold; font-family: Georgia, serif; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

    /* Tarjetas de Pedidos */
    .order-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }
    .order-title { font-weight: bold; font-size: 18px; color: var(--leaf); }
    .order-date { font-size: 12px; color: var(--muted); }
    .order-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; font-size: 14px; }
    .order-items-table { width: 100%; margin-top: 10px; border-collapse: collapse; background: #fdfbf7; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .order-items-table th { font-size: 12px; background: #f3edd9; padding: 8px 10px; }
    .order-items-table td { padding: 8px 10px; font-size: 13.5px; }

    /* Modales / Mensajes */
    .notice { padding: 12px 16px; border-radius: 10px; background: #edf5df; color: #385a35; margin-bottom: 20px; font-weight: 600; display: none; }

    /* Estilos de Impresión / PDF */
    @media print {
      body { background: #fff !important; color: #000 !important; font-size: 12px; overflow: visible; }
      .sidebar, .header-bar, .notice, .btn, .no-print { display: none !important; }
      .main-content { padding: 0 !important; overflow: visible !important; }
      
      /* Salto de página entre zonas distintas */
      .zone-group { page-break-after: always; margin-bottom: 0; }
      .zone-group:last-child { page-break-after: auto; }
      .zone-header { background: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-bottom: 10px; }

      .card, .order-card { box-shadow: none !important; border: 1px solid #ccc !important; margin-bottom: 15px !important; page-break-inside: avoid; }
      .print-only-title { display: block !important; text-align: center; margin-bottom: 20px; font-size: 22px; font-weight: bold; }
      
      /* Ocultar precios sólo cuando sea hoja de reparto */
      .print-hide-price .price-col, 
      .print-hide-price .order-total { display: none !important; }
      
      .print-only { display: inline !important; }
    }
    .print-only { display: none; }
    .print-only-title { display: none; }

    @media (max-width: 900px) {
      .admin-layout { flex-direction: column; height: auto; overflow: visible; }
      body { overflow: auto; }
      .sidebar { width: 100%; height: auto; }
      .main-content { padding: 20px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    
    <!-- Menú Lateral -->
    <aside class="sidebar">
      <div class="sidebar-brand">Buenas<i>raíces</i> Admin</div>
      
      <nav class="nav-menu">
        <a class="nav-item active" onclick="switchView('productsView', this)">
          <span class="icon">🌱</span> Catálogo de Productos
        </a>
        <a class="nav-item" onclick="switchView('ordersView', this)">
          <span class="icon">📦</span> Pedidos
        </a>
      </nav>

      <div style="font-size: 12px; color: #a3b899; text-align: center;">
        Buenas Raíces v2.7
      </div>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="main-content">
      <div id="notice" class="notice"></div>

      <!-- SECCIÓN 1: CATÁLOGO DE PRODUCTOS -->
      <section id="productsView" class="view-section active">
        <div class="header-bar">
          <h1>Gestión del Catálogo</h1>
          <button class="btn btn-secondary" onclick="resetForm()">+ Nuevo Producto</button>
        </div>

        <!-- Formulario Crear/Editar Producto -->
        <div class="card">
          <h2 id="formTitle">Agregar Producto</h2>
          <form id="productForm">
            <input type="hidden" id="prodId">
            
            <div class="form-grid">
              <div class="field">
                <label for="name">Nombre del Producto</label>
                <input id="name" required placeholder="Ej. Orégano, Tomate, Pollo Entero">
              </div>

              <div class="field">
                <label for="category">Categoría</label>
                <select id="category" required>
                  <option value="Verduras">Verduras</option>
                  <option value="Frutas">Frutas</option>
                  <option value="Condimentos">Condimentos</option>
                  <option value="Quesos">Quesos</option>
                  <option value="Bandejas">Bandejas</option>
                  <option value="Huevos">Huevos</option>
                  <option value="Aceite">Aceite</option> 
                  <option value="Miel">Miel</option>
                  <option value="Combos">Combos</option>
                  <option value="Mermeladas/dulces">Mermeladas/dulces</option>
                  <option value="Especias para el mate">Especias para el mate</option>
                  <option value="Carne Vacuna">Carne Vacuna</option>
                  <option value="Carnes de Cerdo">Carnes de Cerdo</option>
                  <option value="Pollo">Pollo</option>
                </select>
              </div>

              <div class="field">
                <label for="sale_unit">Unidad de Venta / Fraccionamiento</label>
                <select id="sale_unit" required onchange="updatePriceLabel()">
                  <option value="kg">Por Kilo (kg)</option>
                  <option value="1g">Por Gramo (1g)</option>
                  <option value="25g">25g</option>
                  <option value="30g">30g</option>
                  <option value="50g">50g</option>
                  <option value="100g">100g</option>
                  <option value="250g">250g</option>
                  <option value="500g">500g</option>
                  <option value="unidad">Por Unidad (Precio Fijo)</option>
                  <option value="unidad_peso">Por Unidad (Precio por Kg / Peso Variable)</option>
                  <option value="docena">Por Docena</option>
                </select>
              </div>

              <div class="field">
                <label for="price" id="priceLabel">Precio por Kilo ($)</label>
                <input id="price" type="number" step="0.01" required placeholder="Ej. 2500">
              </div>

              <div class="field">
                <label for="icon">Icono Emoji (Fallback)</label>
                <input id="icon" placeholder="Ej. 🌿, 🍅, 🧀, 🍗" maxlength="4">
              </div>

              <div class="field">
                <label for="display_order">Orden de aparición</label>
                <input id="display_order" type="number" value="1" placeholder="Ej. 1">
              </div>

              <div class="field full">
                <label for="image_url">URL de la Foto del Producto (Opcional)</label>
                <input id="image_url" type="url" placeholder="https://ejemplo.com/foto.jpg">
              </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
              <button class="btn" type="submit" id="btnSave">Guardar Producto</button>
              <button class="btn btn-secondary" type="button" onclick="resetForm()">Cancelar</button>
            </div>
          </form>
        </div>

        <!-- Lista de Productos -->
        <div class="card">
          <h2>Productos Registrados</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Imagen</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Unidad</th>
                  <th>Orden</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <tr><td colspan="7" style="text-align: center; color: var(--muted);">Cargando productos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SECCIÓN 2: PEDIDOS REALIZADOS -->
      <section id="ordersView" class="view-section">
        
        <h1 class="print-only-title" id="printReportTitle">Lista de Pedidos — Buenas Raíces</h1>

        <div class="header-bar no-print">
          <h1>Pedidos Realizados</h1>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="zoneFilter" onchange="filterOrdersByZone()" style="padding: 8px 12px; font-weight: bold;">
              <option value="ALL">Todas las Zonas</option>
            </select>
            <button class="btn btn-secondary" onclick="loadOrders()">🔄 Actualizar</button>
            <button class="btn" onclick="printReport('full')">📄 PDF Pedidos Completo</button>
            <button class="btn btn-secondary" onclick="printReport('delivery')">🚚 PDF Hoja de Reparto</button>
          </div>
        </div>

        <div id="ordersContainer">
          <p style="color: var(--muted);">Cargando pedidos...</p>
        </div>
      </section>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient(window.BUENASRAICES_SUPABASE_URL, window.BUENASRAICES_SUPABASE_KEY);
    let allProducts = [];
    let rawOrders = [];

    const money = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n || 0);

    function updatePriceLabel() {
      const unit = document.getElementById('sale_unit').value;
      const label = document.getElementById('priceLabel');
      if (unit === 'kg') label.textContent = 'Precio por Kilo ($)';
      else if (unit === '1g') label.textContent = 'Precio por Gramo ($)';
      else if (unit === 'unidad_peso') label.textContent = 'Precio por Kilo ($) [Se vende por unidad]';
      else label.textContent = 'Precio por Unidad ($)';
    }

    function switchView(viewId, element) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

      document.getElementById(viewId).classList.add('active');
      element.classList.add('active');

      if (viewId === 'ordersView') loadOrders();
    }

    function showNotice(msg) {
      const notice = document.getElementById('notice');
      notice.textContent = msg;
      notice.style.display = 'block';
      setTimeout(() => notice.style.display = 'none', 4000);
    }

    // --- PRODUCTOS ---
    async function loadProducts() {
      const { data } = await db.from('products').select('*').order('display_order', { ascending: true });
      allProducts = data || [];
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('productsTableBody');
      if (!allProducts.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--muted);">No hay productos registrados aún.</td></tr>';
        return;
      }

      tbody.innerHTML = allProducts.map(p => `
        <tr>
          <td>${p.image_url ? `<img src="${p.image_url}" class="prod-img-preview">` : `<div class="prod-img-preview">${p.icon || '🌱'}</div>`}</td>
          <td><b>${p.name}</b></td>
          <td>${p.category || '-'}</td>
          <td><b>${money(p.price_per_kg)}</b></td>
          <td>${p.sale_unit || 'kg'}</td>
          <td>${p.display_order || 1}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Editar</button>
            <button class="btn btn-danger" onclick="deleteProduct('${p.id}', '${p.name}')">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prodId = document.getElementById('prodId').value;
      const payload = {
        name: document.getElementById('name').value.trim(),
        category: document.getElementById('category').value,
        price_per_kg: parseFloat(document.getElementById('price').value),
        sale_unit: document.getElementById('sale_unit').value,
        icon: document.getElementById('icon').value.trim() || '🌱',
        display_order: parseInt(document.getElementById('display_order').value) || 1,
        image_url: document.getElementById('image_url').value.trim() || null,
        active: true
      };

      if (prodId) await db.from('products').update(payload).eq('id', prodId);
      else await db.from('products').insert(payload);

      showNotice(prodId ? '¡Producto actualizado!' : '¡Producto creado!');
      resetForm();
      loadProducts();
    });

    function editProduct(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;
      document.getElementById('prodId').value = p.id;
      document.getElementById('name').value = p.name;
      document.getElementById('category').value = p.category || 'Verduras';
      document.getElementById('sale_unit').value = p.sale_unit || 'kg';
      document.getElementById('price').value = p.price_per_kg;
      document.getElementById('icon').value = p.icon || '';
      document.getElementById('display_order').value = p.display_order || 1;
      document.getElementById('image_url').value = p.image_url || '';
      document.getElementById('formTitle').textContent = 'Editar Producto: ' + p.name;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('prodId').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('formTitle').textContent = 'Agregar Producto';
    }

    async function deleteProduct(id, name) {
      if (!confirm(`¿Eliminar "${name}"?`)) return;
      await db.from('products').delete().eq('id', id);
      loadProducts();
    }

    // --- CARGAR Y GESTIONAR PEDIDOS DIVIDIDOS POR ZONA ---
    async function loadOrders() {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '<p style="color: var(--muted);">Cargando pedidos...</p>';

      const { data, error } = await db.from('orders').select(`*, order_items(*)`).order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p style="color: var(--danger);">Error al cargar pedidos: ' + error.message + '</p>';
        return;
      }

      rawOrders = data || [];
      populateZoneFilter();
      filterOrdersByZone();
    }

    function populateZoneFilter() {
      const select = document.getElementById('zoneFilter');
      const current = select.value;
      const zones = [...new Set(rawOrders.map(o => (o.zone || o.city || 'Sin Zona').trim()))].sort();
      
      select.innerHTML = '<option value="ALL">Todas las Zonas</option>' + 
        zones.map(z => `<option value="${z}">${z}</option>`).join('');
      
      select.value = current;
    }

    function filterOrdersByZone() {
      const selectedZone = document.getElementById('zoneFilter').value;
      let filtered = rawOrders;

      if (selectedZone !== 'ALL') {
        filtered = rawOrders.filter(o => (o.zone || o.city || 'Sin Zona').trim() === selectedZone);
      }

      renderOrdersGroupedByZone(filtered);
    }

    function renderOrdersGroupedByZone(ordersList) {
      const container = document.getElementById('ordersContainer');
      if (!ordersList || ordersList.length === 0) {
        container.innerHTML = '<div class="card"><p style="margin: 0; color: var(--muted);">No hay pedidos para mostrar.</p></div>';
        return;
      }

      const grouped = {};
      ordersList.forEach(order => {
        const zoneName = (order.zone || order.city || 'Sin Zona').trim();
        if (!grouped[zoneName]) grouped[zoneName] = [];
        grouped[zoneName].push(order);
      });

      let html = '';

      for (const [zone, zoneOrders] of Object.entries(grouped)) {
        html += `
          <div class="zone-group">
            <div class="zone-header">
              <span>📍 Zona: ${zone}</span>
              <span style="font-size: 14px; font-weight: normal;">(${zoneOrders.length} pedido${zoneOrders.length > 1 ? 's' : ''})</span>
            </div>
            ${zoneOrders.map(order => renderSingleOrderCard(order)).join('')}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderSingleOrderCard(order) {
      const orderDate = order.created_at ? new Date(order.created_at).toLocaleString('es-AR') : 'Sin fecha';
      
      let totalCalculado = 0;
      let itemsRows = '';

      if (order.order_items && order.order_items.length > 0) {
        itemsRows = order.order_items.map(item => {
          const unitPrice = item.unit_price || 0;
          const units = item.units_quantity || 1;
          const weight = item.weight_quantity !== undefined && item.weight_quantity !== null ? item.weight_quantity : (item.quantity || 1);
          
          // Determinamos el subtotal según el tipo de venta
          const isWeightBased = item.sale_unit === 'kg' || item.sale_unit === 'unidad_peso' || item.sale_unit === '1g';
          const subtotal = item.price !== undefined && item.price !== null ? item.price : (isWeightBased ? weight * unitPrice : units * unitPrice);
          totalCalculado += subtotal;

          return `
            <tr>
              <td><b>${item.product_name}</b></td>
              <td>
                <div class="no-print" style="display: flex; gap: 8px; align-items: center;">
                  <label style="font-size: 11px;">Cant. Unid:
                    <input type="number" step="1" min="1" value="${units}" 
                      style="width: 55px; padding: 3px;"
                      onchange="updateItemValues('${item.id}', '${order.id}', this.value, null, ${unitPrice}, '${item.sale_unit}')">
                  </label>
                  <label style="font-size: 11px;">Peso Real (Kg/g):
                    <input type="number" step="0.01" min="0" value="${weight}" 
                      style="width: 75px; padding: 3px;"
                      onchange="updateItemValues('${item.id}', '${order.id}', null, this.value, ${unitPrice}, '${item.sale_unit}')">
                  </label>
                </div>
                <span class="print-only">
                  ${units} un. ${isWeightBased ? `(${weight} kg)` : ''}
                </span>
              </td>
              <td class="price-col"><b>${money(unitPrice)}</b> / ${item.sale_unit || 'un'}</td>
              <td class="price-col"><b>${money(subtotal)}</b></td>
              <td class="no-print" style="text-align: right;">
                <button class="btn btn-danger btn-sm" onclick="deleteOrderItem('${item.id}', '${order.id}')">✕</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      const finalTotal = order.total !== undefined && order.total !== null ? order.total : totalCalculado;

      return `
        <div class="order-card" id="order-card-${order.id}">
          <div class="order-header">
            <span class="order-title">Pedido #${order.id}</span>
            <span class="order-date">${orderDate}</span>
          </div>

          <div class="order-info">
            <div><b>Cliente:</b> ${order.customer_name || 'Sin nombre'}</div>
            <div><b>Teléfono:</b> ${order.phone ? `<a href="https://wa.me/${order.phone.replace(/[^0-9]/g, '')}" target="_blank" style="color: var(--leaf); font-weight: bold;">${order.phone}</a>` : 'N/A'}</div>
            <div><b>Dirección:</b> ${order.address || 'Retira en local'} (${order.city || 'N/A'})</div>
            <div><b>Zona:</b> <span style="background: var(--lime); padding: 2px 8px; border-radius: 6px; font-weight: bold;">${order.zone || order.city || 'Sin Zona'}</span></div>
            ${order.notes ? `<div style="grid-column: 1 / -1;"><b>Notas:</b> ${order.notes}</div>` : ''}
          </div>

          <h4 style="margin: 10px 0 5px; font-size: 14px;">Detalle de la compra:</h4>
          <table class="order-items-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad / Peso Real</th>
                <th class="price-col">Precio Unit. / Kg</th>
                <th class="price-col">Subtotal</th>
                <th class="no-print" style="width: 40px;"></th>
              </tr>
            </thead>
            <tbody>
              ${itemsRows || '<tr><td colspan="5">Sin productos en el pedido</td></tr>'}
            </tbody>
          </table>

          <div class="no-print" style="margin-top: 10px;">
            <button class="btn btn-secondary btn-sm" onclick="promptAddItem('${order.id}')">+ Agregar Producto a este Pedido</button>
          </div>

          <div class="order-total" style="text-align: right; margin-top: 15px; font-size: 18px; border-top: 1px dashed var(--line); padding-top: 10px;">
            <b>Total del Pedido: <span style="color: var(--leaf); font-size: 20px;">${money(finalTotal)}</span></b>
          </div>
        </div>
      `;
    }

    // Actualizar Cantidad de Unidades y/o Peso Real de un producto
    async function updateItemValues(itemId, orderId, newUnits, newWeight, unitPrice, saleUnit) {
      // Buscar el ítem actual en local para conservar valores no cambiados
      const currentOrder = rawOrders.find(o => o.id == orderId);
      const currentItem = currentOrder ? (currentOrder.order_items || []).find(i => i.id == itemId) : null;

      let units = newUnits !== null ? parseFloat(newUnits) : (currentItem ? currentItem.units_quantity || 1 : 1);
      let weight = newWeight !== null ? parseFloat(newWeight) : (currentItem ? currentItem.weight_quantity || currentItem.quantity || 1 : 1);

      if (isNaN(units) || units < 1) units = 1;
      if (isNaN(weight) || weight < 0) weight = 0;

      const isWeightBased = saleUnit === 'kg' || saleUnit === 'unidad_peso' || saleUnit === '1g';
      const newSubtotal = isWeightBased ? (weight * unitPrice) : (units * unitPrice);

      await db.from('order_items').update({ 
        units_quantity: units,
        weight_quantity: weight,
        quantity: isWeightBased ? weight : units,
        price: newSubtotal 
      }).eq('id', itemId);

      await recalculateOrderTotal(orderId);
    }

    // Eliminar Ítem del Pedido
    async function deleteOrderItem(itemId, orderId) {
      if (!confirm('¿Quitar este producto del pedido?')) return;
      await db.from('order_items').delete().eq('id', itemId);
      await recalculateOrderTotal(orderId);
    }

    // Agregar Producto Manualmente a un Pedido Existente
    async function promptAddItem(orderId) {
      const prodName = prompt("Ingresá el nombre del producto a agregar:");
      if (!prodName) return;
      const unitPrice = parseFloat(prompt("Ingresá el precio unitario / por Kilo ($):"));
      if (isNaN(unitPrice)) return;
      const qty = parseFloat(prompt("Ingresá la cantidad o peso total (Kilos/Unidades):", "1")) || 1;

      const subtotal = qty * unitPrice;

      await db.from('order_items').insert({
        order_id: orderId,
        product_name: prodName,
        units_quantity: 1,
        weight_quantity: qty,
        quantity: qty,
        unit_price: unitPrice,
        price: subtotal,
        sale_unit: 'unidad'
      });

      await recalculateOrderTotal(orderId);
    }

    // Recalcular y Actualizar Total Global del Pedido
    async function recalculateOrderTotal(orderId) {
      const { data: items } = await db.from('order_items').select('price').eq('order_id', orderId);
      const newTotal = (items || []).reduce((sum, item) => sum + (item.price || 0), 0);

      await db.from('orders').update({ total: newTotal }).eq('id', orderId);
      showNotice('Pedido #' + orderId + ' actualizado correctamente.');
      loadOrders();
    }

    // --- IMPRESIÓN Y GENERACIÓN DE PDF ---
    function printReport(type) {
      const container = document.getElementById('ordersContainer');
      const title = document.getElementById('printReportTitle');

      if (type === 'delivery') {
        container.classList.add('print-hide-price');
        title.textContent = "Hoja de Ruta y Reparto — Buenas Raíces";
      } else {
        container.classList.remove('print-hide-price');
        title.textContent = "Lista Completa de Pedidos — Buenas Raíces";
      }

      window.print();
    }

    loadProducts();
  </script>
</body>
</html>
